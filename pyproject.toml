[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosthandoff"
version = "0.1.0"
description = "Session handoff pack for GhostSlice projects: git state, session changes, verification status, open loops and next steps, drafted from repo facts only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "handoff", "agents", "git"]
dependencies = []

[project.scripts]
ghosthandoff = "ghosthandoff.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
